apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-2
  namespace: solid-stats-staging
  labels:
    app.kubernetes.io/name: server-2
    app.kubernetes.io/part-of: solid-stats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: server-2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server-2
        app.kubernetes.io/part-of: solid-stats
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: server-2
          image: ghcr.io/solid-stats/server-2:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: server-2-config
            - secretRef:
                name: server-2-runtime
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
